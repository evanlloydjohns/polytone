name: Fabric 26.3 build

on:
  push:
    branches: [26.3-fabric-first-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap published 26.2 libraries for the first port build
        shell: pwsh
        run: .github/scripts/bootstrap-26.2-deps.ps1
      - name: Build Fabric JAR
        run: .\gradlew.bat :fabric:build --console=plain --no-daemon
      - name: Verify alpha excludes unported shader files
        shell: pwsh
        run: |
          $jar = Get-ChildItem fabric/build/libs -Filter '*.jar' |
            Where-Object { $_.Name -notlike '*-sources.jar' } |
            Select-Object -First 1
          if ($null -eq $jar) { throw 'Installable Fabric JAR was not found' }
          $entries = & jar tf $jar.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect Fabric JAR' }
          if ($entries | Where-Object { $_ -like 'assets/polytone/shaders/*' }) {
            throw 'The 26.3 alpha still bundles unported Polytone shaders'
          }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: polytone-26.3-fabric-first-build
          path: fabric/build/libs/*.jar
      - name: Smoke-launch Fabric client
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: |
          .\gradlew.bat :fabric:runClient --console=plain --no-daemon *> run-client.log
          $exitCode = $LASTEXITCODE
          Get-Content run-client.log -Tail 160
          exit $exitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polytone-26.3-fabric-smoke-log
          path: run-client.log
          if-no-files-found: ignore
